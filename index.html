<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Home Control Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root { --bg: #121214; --card: #1c1c1e; --accent: #0a84ff; --txt: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 15px; }
        h1, h2 { font-weight: 600; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .card { background: var(--card); border-radius: 14px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-off { background: #3a3a3c; }
        input[type=range] { width: 100%; margin: 10px 0; }
        input[type=color] { border: none; width: 100%; height: 40px; border-radius: 8px; cursor: pointer; background: transparent; }
    </style>
</head>
<body>

    <h1>🏡 Home Control Hub</h1>

    <!-- DIMMER LIGHTS -->
    <h2>AC Dimmable Lights</h2>
    <div class="grid">
        <div class="card">
            <span>Light 1 (Dimmer)</span>
            <input type="range" min="0" max="100" value="0" onchange="sendCmd('DIM:1:' + this.value)">
        </div>
        <div class="card">
            <span>Light 2 (Dimmer)</span>
            <input type="range" min="0" max="100" value="0" onchange="sendCmd('DIM:2:' + this.value)">
        </div>
        <div class="card">
            <span>Light 3 (Dimmer)</span>
            <input type="range" min="0" max="100" value="0" onchange="sendCmd('DIM:3:' + this.value)">
        </div>
        <div class="card">
            <span>Light 4 (Dimmer)</span>
            <input type="range" min="0" max="100" value="0" onchange="sendCmd('DIM:4:' + this.value)">
        </div>
    </div>

    <!-- RELAY LIGHTS -->
    <h2>Switched Lights</h2>
    <div class="grid">
        <div class="card">
            <span>Light 5</span>
            <button class="btn" onclick="sendCmd('RELAY:5:ON')">ON</button>
            <button class="btn btn-off" onclick="sendCmd('RELAY:5:OFF')">OFF</button>
        </div>
        <div class="card">
            <span>Light 6</span>
            <button class="btn" onclick="sendCmd('RELAY:6:ON')">ON</button>
            <button class="btn btn-off" onclick="sendCmd('RELAY:6:OFF')">OFF</button>
        </div>
        <div class="card">
            <span>Light 7</span>
            <button class="btn" onclick="sendCmd('RELAY:7:ON')">ON</button>
            <button class="btn btn-off" onclick="sendCmd('RELAY:7:OFF')">OFF</button>
        </div>
    </div>

    <!-- RGB LED STRIPS -->
    <h2>RGB Lighting</h2>
    <div class="grid">
        <div class="card">
            <span>RGB Strip 1</span>
            <input type="color" onchange="sendRGB(1, this.value)">
        </div>
        <div class="card">
            <span>RGB Strip 2</span>
            <input type="color" onchange="sendRGB(2, this.value)">
        </div>
    </div>

    <!-- HEATING CONTROL -->
    <h2>Heating System</h2>
    <div class="grid">
        <div class="card">
            <span>Hot Water</span>
            <button class="btn" onclick="sendCmd('HEAT:HW:ON')">ON</button>
            <button class="btn btn-off" onclick="sendCmd('HEAT:HW:OFF')">OFF</button>
        </div>
        <div class="card">
            <span>Central Heating</span>
            <button class="btn" onclick="sendCmd('HEAT:CH:ON')">ON</button>
            <button class="btn btn-off" onclick="sendCmd('HEAT:CH:OFF')">OFF</button>
        </div>
    </div>

    <script>
        // Converts HEX Colors from <input type="color"> to RGB
        function sendRGB(stripNum, hex) {
            let r = parseInt(hex.substr(1,2), 16);
            let g = parseInt(hex.substr(3,2), 16);
            let b = parseInt(hex.substr(5,2), 16);
            sendCmd(`RGB:${stripNum}:${r},${g},${b}`);
        }

        function sendCmd(cmd) {
            console.log("Sending Command: ", cmd);
            if (typeof client !== 'undefined' && client.connected) {
                let message = new Paho.MQTT.Message(cmd);
                message.destinationName = "myhome/mega/command";
                client.send(message);
            }
        }
    </script>
</body>
</html>
